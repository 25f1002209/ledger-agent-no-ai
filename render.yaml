services:
  - type: web
    name: ledger-agent-no-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LEDGER_API_URL
        sync: false
      - key: UPSTREAM_TIMEOUT_SECONDS
        value: "8"
